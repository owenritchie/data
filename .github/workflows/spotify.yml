name: spotify

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Create .env file
        run: |
          cat > .env << EOF
          SPOTIFY_CLIENT_ID=${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET=${{ secrets.SPOTIFY_CLIENT_SECRET }}
          SPOTIFY_REFRESH_TOKEN=${{ secrets.SPOTIFY_REFRESH_TOKEN }}
          POSTGRES_USER=${{ secrets.POSTGRES_USERNAME }}
          POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_HOST=${{ secrets.POSTGRES_HOST }}
          POSTGRES_PORT=${{ secrets.POSTGRES_PORT }}
          POSTGRES_NAME=${{ secrets.POSTGRES_DATABASE }}
          EOF

      - name: Create dbt profiles file
        run: |
          mkdir -p ~/.dbt
          cat > ~/.dbt/profiles.yml << EOF
          spotify:
            outputs:
              dev:
                type: postgres
                host: ${{ secrets.POSTGRES_HOST }}
                user: ${{ secrets.POSTGRES_USERNAME }}
                pass: ${{ secrets.POSTGRES_PASSWORD }}
                port: ${{ secrets.POSTGRES_PORT }}
                dbname: ${{ secrets.POSTGRES_DATABASE }}
                schema: public
                threads: 1
            target: dev
          EOF

      - name: Run Spotify ingestion pipeline
        run: python ingestion/spotify/raw_spotify_plays.py

      - name: Run dbt models
        working-directory: ./dbt/spotify
        run: dbt run

      - name: Pipeline completed
        run: echo "Spotify recently-played pipeline run completed successfully!"
